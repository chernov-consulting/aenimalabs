<svg xmlns="http://www.w3.org/2000/svg" width="1128" height="191" viewBox="0 0 1128 191">
  <!-- LinkedIn cover. Official brand colours and AE mark.
       Left 280px and bottom edge stay clear for LinkedIn's logo overlay. -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="100%" stop-color="#24243A"/>
    </linearGradient>
  </defs>
  <rect width="1128" height="191" fill="url(#bg)"/>
  <rect x="280" y="0" width="848" height="4" fill="#6B8F8E"/>

  <text x="320" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="400" letter-spacing="8" fill="#F5F3EF">AENIMA</text>
  <text x="320" y="106" font-family="Calibri, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" letter-spacing="12" fill="#6B8F8E">LABS</text>
  <text x="320" y="136" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" fill="#F5F3EF">Technology with a soul.</text>
  <text x="320" y="158" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" fill="#6B8F8E">What makes us human, preserved.</text>

  <g transform="translate(1024,96) scale(0.72)">
    <polygon points="-72,80 -12,-80 -2,-80 -42,80" fill="#F5F3EF"/>
    <polygon points="8,-80 18,-80 18,80 8,80" fill="#F5F3EF"/>
    <rect x="-38" y="2" width="56" height="10" fill="#F5F3EF"/>
    <rect x="8" y="-80" width="60" height="10" fill="#F5F3EF"/>
    <rect x="8" y="2" width="50" height="10" fill="#F5F3EF"/>
    <rect x="8" y="70" width="60" height="10" fill="#F5F3EF"/>
  </g>
</svg>
