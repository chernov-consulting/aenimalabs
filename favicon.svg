<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
	<circle cx="40" cy="40" r="40" fill="#1A1A2E"/>
	<!-- Æ ligature: A-stroke + E -->
	<!-- A diagonal left leg -->
	<line x1="18" y1="58" x2="34" y2="20" stroke="#F5F3EF" stroke-width="4.5" stroke-linecap="round"/>
	<!-- A crossbar -->
	<line x1="22" y1="44" x2="33" y2="44" stroke="#F5F3EF" stroke-width="3.5" stroke-linecap="round"/>
	<!-- E vertical spine -->
	<line x1="36" y1="20" x2="36" y2="58" stroke="#F5F3EF" stroke-width="4.5" stroke-linecap="round"/>
	<!-- E top arm -->
	<line x1="36" y1="20" x2="56" y2="20" stroke="#F5F3EF" stroke-width="4" stroke-linecap="round"/>
	<!-- E mid arm -->
	<line x1="36" y1="40" x2="52" y2="40" stroke="#F5F3EF" stroke-width="3.5" stroke-linecap="round"/>
	<!-- E bottom arm -->
	<line x1="36" y1="58" x2="56" y2="58" stroke="#F5F3EF" stroke-width="4" stroke-linecap="round"/>
</svg>
